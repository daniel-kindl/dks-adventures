name: Materialize QoL baseline

on:
  push:
    branches:
      - feat/v0.1-qol-infrastructure
    paths:
      - .github/workflows/materialize-qol.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.1-qol-infrastructure

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false

      - name: Install pinned Packwiz
        run: |
          go install github.com/packwiz/packwiz@dfd8b68a4796c763e25bad50265ea1f1233e24f1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add pinned Modrinth projects
        run: |
          packwiz modrinth add "https://modrinth.com/mod/yungs-api/version/PJOYAmAs"
          packwiz modrinth add "https://modrinth.com/mod/paxi/version/C7buFh0l"
          packwiz modrinth add "https://modrinth.com/mod/comforts/version/gBDsc134"
          packwiz modrinth add "https://modrinth.com/mod/jade/version/xJQHCmWJ"
          packwiz modrinth add "https://modrinth.com/mod/emi/version/WtJS5tVw"
          packwiz modrinth add "https://modrinth.com/mod/simple-backups/version/27zw3anx"
          packwiz modrinth add "https://modrinth.com/mod/gravestone-mod/version/kSpC0ysX"

      - name: Add pinned CurseForge projects
        run: |
          packwiz curseforge add "https://www.curseforge.com/minecraft/mc-mods/zeta/files/7335229"
          packwiz curseforge add "https://www.curseforge.com/minecraft/mc-mods/quark/files/6427817"
          packwiz curseforge add "https://www.curseforge.com/minecraft/mc-mods/carry-on/files/4882500"
          packwiz --yes curseforge add better-advancements
          packwiz refresh

      - name: Commit generated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pack.toml index.toml mods
          git commit -m 'build: refresh QoL mod metadata [skip ci]'
          git pull --rebase origin feat/v0.1-qol-infrastructure
          git push origin HEAD:feat/v0.1-qol-infrastructure
