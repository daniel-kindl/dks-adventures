name: Materialize world baseline

on:
  push:
    branches:
      - feat/v0.1-world-exploration
    paths:
      - .github/workflows/materialize-world.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/v0.1-world-exploration

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false

      - name: Install pinned Packwiz
        run: |
          go install github.com/packwiz/packwiz@dfd8b68a4796c763e25bad50265ea1f1233e24f1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Add terrain and cave content
        run: |
          packwiz modrinth add "https://modrinth.com/datapack/tectonic/version/KLmvRxwh"
          packwiz modrinth add "https://modrinth.com/mod/citadel/version/a7H8TGhJ"
          packwiz modrinth add "https://modrinth.com/mod/alexs-caves/version/lC8HHXOF"

      - name: Add curated YUNG structure overhauls
        run: |
          packwiz modrinth add "https://modrinth.com/mod/yungs-better-dungeons/version/kPiQ6v4q"
          packwiz modrinth add "https://modrinth.com/mod/yungs-better-mineshafts/version/kVO57zxB"
          packwiz modrinth add "https://modrinth.com/mod/yungs-better-strongholds/version/rwiShgsc"
          packwiz modrinth add "https://modrinth.com/mod/yungs-better-desert-temples/version/lRK2ZA9U"
          packwiz modrinth add "https://modrinth.com/mod/yungs-better-jungle-temples/version/CXQc6EnZ"
          packwiz modrinth add "https://modrinth.com/mod/yungs-better-ocean-monuments/version/SN4iZ7wf"
          packwiz modrinth add "https://modrinth.com/mod/yungs-better-nether-fortresses/version/1.20-Forge-2.0.6"

      - name: Add globally loaded datapacks
        run: |
          packwiz --meta-folder config/paxi/datapacks modrinth add "https://modrinth.com/datapack/dungeons-and-taverns/version/J9ojWPrx"
          packwiz --meta-folder config/paxi/datapacks modrinth add "https://modrinth.com/datapack/blazeandcaves-advancements-pack/version/T3BLedpI"
          packwiz refresh

      - name: Commit generated metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pack.toml index.toml mods config/paxi
          git commit -m 'build: materialize world and exploration metadata [skip ci]'
          git pull --rebase origin feat/v0.1-world-exploration
          git push origin HEAD:feat/v0.1-world-exploration
