name: Cleanup merged branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete branches from merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" \
            | jq -r --arg repo "$GITHUB_REPOSITORY" \
                '.[] | select(.merged_at != null and .head.repo.full_name == $repo) | .head.ref' \
            | sort -u \
            | while IFS= read -r branch; do
                [ -n "$branch" ] || continue
                [ "$branch" != "main" ] || continue

                if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
                  echo "Deleting merged branch: $branch"
                  git push origin --delete "$branch"
                fi
              done
